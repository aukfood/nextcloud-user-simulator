# conductor.example.conf - copier en conductor.conf, puis adapter.
#
# scenario.json décide du test. Ce fichier dit seulement quel PC lance
# quels utilisateurs.
#
# Une ligne par PC :
#   machine   dossier   USER_FROM USER_TO   [EDITOR_FROM EDITOR_TO]
#
# - machine : "leader" pour ce PC, sinon utilisateur@machine (accès SSH par clé).
# - dossier : dossier du projet sur le PC follower ("-" pour le leader).
# - USER : utilisateurs en appel. Les plages couvrent 1 à totalUsers sans se
#   chevaucher.
# - EDITOR : seulement si des éditeurs sont hors appel (voir exemples 2 et 3).

# 1. Talk, ou mixed avec editorsInCall true : 30 utilisateurs sur 2 PC.
#    En mixed, les derniers utilisateurs de l'appel éditent aussi, sans comptes
#    en plus : pas de colonnes EDITOR. Ex. 5 documents x 2 éditeurs = les
#    utilisateurs 21 à 30, lancés par le PC qui a cette plage.
leader                         -                          1  15
<UTILISATEUR>@<PC_FOLLOWER>    nextcloud-user-simulator   16 30

# 2. Mixed avec editorsInCall false : 30 en appel, plus 10 éditeurs hors appel.
#    Les éditeurs sont des comptes en plus, numérotés après totalUsers :
#    ici 31 à 40 (5 documents x 2 éditeurs). Ne pas reprendre les numéros
#    de l'appel.
# leader                       -                          1  15   31 35
# <UTILISATEUR>@<PC_FOLLOWER>  nextcloud-user-simulator   16 30   36 40

# 3. Office seul : 20 éditeurs, pas d'appel (USER à "- -").
# leader                       -                          -  -    1  10
# <UTILISATEUR>@<PC_FOLLOWER>  nextcloud-user-simulator   -  -    11 20
